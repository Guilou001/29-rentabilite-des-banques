[project]
name = "rdb"
version = "1.0.0"
description = "D'où vient le rendement des banques canadiennes : la décomposition de DuPont sur trente ans de relevés du BSIF"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guillaume Vaudescal" }]
dependencies = [
    "gvf[figures,osfi]>=0.3.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "typer>=0.12",
]

[project.scripts]
rdb = "rdb.cli:app"

[project.urls]
Homepage = "https://github.com/Guilou001/29-rentabilite-des-banques"

[tool.uv.sources]
gvf = { git = "https://github.com/Guilou001/gv-fintools", tag = "v0.3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdb"]

[dependency-groups]
dev = ["duckdb>=1.1", "pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
